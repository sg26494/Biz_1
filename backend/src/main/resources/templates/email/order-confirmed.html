<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:24px;background:#f6f3ee;font-family:Arial,Helvetica,sans-serif;color:#2b2622;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:28px;">
<h2 style="margin-top:0;">Thank you! Your order is confirmed.</h2>
<p>Order <strong th:text="${order.orderNumber}">ORD</strong> is paid. We'll pack it and email you the tracking link once it ships.</p>

<table style="width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;">
  <tr th:each="it : ${order.items}">
    <td style="padding:8px 0;border-bottom:1px solid #eee;">
      <span th:text="${it.productTitle}">Product</span><br>
      <span style="color:#8a817a;font-size:12px;" th:text="${it.variantTitle + ' × ' + it.qty}">Variant × 1</span>
    </td>
    <td style="padding:8px 0;border-bottom:1px solid #eee;text-align:right;" th:text="${money.format(it.lineTotalPaise)}">₹0</td>
  </tr>
</table>
<table style="width:100%;font-size:14px;">
  <tr><td>Subtotal</td><td style="text-align:right;" th:text="${money.format(order.subtotalPaise)}"></td></tr>
  <tr th:if="${order.discountPaise > 0}"><td>Discount</td><td style="text-align:right;" th:text="${'-' + money.format(order.discountPaise)}"></td></tr>
  <tr><td>Shipping</td><td style="text-align:right;" th:text="${order.shippingPaise == 0 ? 'Free' : money.format(order.shippingPaise)}"></td></tr>
  <tr><td><strong>Total paid</strong></td><td style="text-align:right;"><strong th:text="${money.format(order.totalPaise)}"></strong></td></tr>
  <tr><td colspan="2" style="font-size:12px;color:#8a817a;">Prices include GST.</td></tr>
</table>

<p style="font-size:14px;"><strong>Delivering to</strong><br>
<span th:text="${order.shippingAddress.name}"></span><br>
<span th:text="${order.shippingAddress.line1}"></span><span th:if="${order.shippingAddress.line2 != null}" th:text="${', ' + order.shippingAddress.line2}"></span><br>
<span th:text="${order.shippingAddress.city + ', ' + order.shippingAddress.state + ' ' + order.shippingAddress.pincode}"></span></p>
<p><a th:href="${siteUrl + '/account/orders/' + order.id}" style="display:inline-block;background:#8a4b2a;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">View your order</a></p>
<p style="margin-top:32px;font-size:12px;color:#8a817a;">Questions? Just reply to this email.<br>
<a th:href="${siteUrl}" style="color:#8a4b2a;">Visit the store</a></p>
</div></body></html>
