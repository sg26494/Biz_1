spring:
  application:
    name: store-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store}
    username: ${DB_USER:store}
    password: ${DB_PASSWORD:store}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  thymeleaf:
    check-template-location: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jobs:
    enabled: ${JOBS_ENABLED:false}
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-0123456789}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    signup-token-ttl: PT15M
    cookie-secure: ${COOKIE_SECURE:true}
    otp-pepper: ${OTP_PEPPER:change-me-otp-pepper}
  admin:
    seed-emails: ${ADMIN_SEED_EMAILS:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  email:
    provider: ${EMAIL_PROVIDER:smtp}   # smtp (Mailpit locally, or SES SMTP) | resend | log
    from: ${EMAIL_FROM:Store <orders@example.com>}
    admin-alert-to: ${ADMIN_ALERT_EMAILS:}
    resend-api-key: ${RESEND_API_KEY:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: https://api.razorpay.com/v1
  shiprocket:
    enabled: ${SHIPROCKET_ENABLED:false}
    email: ${SHIPROCKET_EMAIL:}
    password: ${SHIPROCKET_PASSWORD:}
    base-url: https://apiv2.shiprocket.in/v1/external
  storage:
    endpoint: ${STORAGE_ENDPOINT:}            # R2: https://<account>.r2.cloudflarestorage.com ; empty for AWS S3
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:store-media}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/store-media}
    path-style: ${STORAGE_PATH_STYLE:true}
  frontend:
    revalidate-url: ${FRONTEND_REVALIDATE_URL:http://localhost:3000/api/revalidate}
    revalidate-secret: ${REVALIDATE_SECRET:dev-revalidate-secret}

logging:
  level:
    root: INFO
    com.store: INFO

---
spring:
  config:
    activate:
      on-profile: local
app:
  security:
    cookie-secure: false

---
# Same jar, run as the background worker: no HTTP server, jobs on.
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none
  flyway:
    enabled: false
app:
  jobs:
    enabled: true
