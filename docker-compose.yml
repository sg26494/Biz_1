# Local development: Postgres, Mailpit (catches emails at http://localhost:8025), MinIO (S3-compatible
# storage at http://localhost:9001), the API, the worker and the web app.
#   docker compose up -d postgres mailpit   # then run api/web from your IDE, or:
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # Optional photo storage for local testing. MinIO no longer publishes free images on Docker Hub, so this
  # is off by default; start it with `docker compose --profile photos up` once you pick an S3-compatible image.
  minio:
    profiles: ["photos"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    profiles: ["photos"]
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 minio minio12345 &&
             mc mb -p local/store-media && mc anonymous set download local/store-media &&
             mc admin config set local api cors_allow_origin='*' || true"

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/store
      SMTP_HOST: mailpit
      STORAGE_ENDPOINT: http://minio:9000
      FRONTEND_REVALIDATE_URL: http://web:3000/api/revalidate
    ports: ["8080:8080"]

  worker:
    build: ./backend
    depends_on: [api]
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local,worker
      DB_URL: jdbc:postgresql://postgres:5432/store
      SMTP_HOST: mailpit
      STORAGE_ENDPOINT: http://minio:9000
      FRONTEND_REVALIDATE_URL: http://web:3000/api/revalidate

  web:
    build:
      context: ./frontend
      # Next.js bakes these in at build time (the /api rewrite target and public settings).
      args:
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Gulmohar Fabrics}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on: [api]
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8080
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
